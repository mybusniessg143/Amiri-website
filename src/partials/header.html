<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="/" aria-label="{{tradingName}} – home">
      <picture><source type="image/webp" srcset="{{logo.webp}}" sizes="(min-width: 1366px) 280px, (min-width: 1100px) 256px, (min-width: 600px) 220px, 184px"><img src="{{logo.src}}" srcset="{{logo.png}}" sizes="(min-width: 1366px) 280px, (min-width: 1100px) 256px, (min-width: 600px) 220px, 184px" width="{{logo.width}}" height="{{logo.height}}" alt="{{logo.alt}}" fetchpriority="high"></picture>
    </a>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul class="site-nav__list">
{{html.nav}}
      </ul>
      <div class="site-nav__cta">
        <a class="btn btn--gold btn--lg" href="tel:{{phone.tel}}">{{icon phone}}Call Now · {{phone.display}}</a>
        <a class="btn btn--wa btn--lg" href="{{page.waUrl}}" rel="noopener">{{icon whatsapp}}WhatsApp</a>
        <a class="btn btn--outline btn--lg" href="{{page.quoteUrl}}">Get a Free Quote</a>
      </div>
    </nav>
    <div class="site-header__cta">
      <a class="header-quote" href="{{page.quoteUrl}}">Get a Free Quote</a>
      <a class="btn btn--gold header-call" href="tel:{{phone.tel}}">{{icon phone}}<span class="header-call__label">Call Now</span><span class="header-call__num">{{phone.display}}</span></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">{{icon menu}}<span class="visually-hidden">Open menu</span></button>
    </div>
  </div>
</header>
